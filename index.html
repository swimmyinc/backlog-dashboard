<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保守工数ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0EA;
    --paper:#F7F8F3;
    --ink:#1F2A22;
    --ink-soft:#586256;
    --line:#C8CDBE;
    --accent:#2F6F62;
    --accent-soft:#DCE9E3;
    --amber:#B4802B;
    --amber-soft:#F3E6CC;
    --red:#A5382E;
    --red-soft:#F2DCD8;
    --shadow: 0 1px 0 rgba(31,42,34,0.06);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Zen Kaku Gothic New', sans-serif;
    letter-spacing:0.02em;
  }
  .app{ max-width:1040px; margin:0 auto; padding:28px 20px 80px; }

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px; margin-bottom:22px; flex-wrap:wrap; gap:10px;
  }
  header.top .brand{ display:flex; align-items:baseline; gap:10px; }
  header.top h1{ font-size:22px; font-weight:900; margin:0; }
  header.top .sub{ font-size:12px; color:var(--ink-soft); }

  button.primary{
    font-family:'Zen Kaku Gothic New', sans-serif;
    background:var(--ink); color:var(--paper); border:none;
    padding:9px 16px; font-size:13px; font-weight:700;
    border-radius:var(--radius); cursor:pointer;
  }
  button.primary:hover{background:var(--accent);}
  button.ghost{
    background:none; border:1px solid var(--line); padding:7px 12px;
    font-size:12px; border-radius:var(--radius); cursor:pointer; color:var(--ink-soft);
  }
  button.ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  button.link{
    background:none;border:none;color:var(--accent);cursor:pointer;
    font-size:12px; padding:2px 4px; text-decoration:underline;
  }

  select, input[type=text]{
    font-family:'Noto Sans JP', sans-serif; font-size:13px;
    border:1px solid var(--line); background:var(--paper);
    padding:7px 10px; border-radius:var(--radius); color:var(--ink);
  }
  select:focus, input:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .tag{
    font-size:10px; padding:2px 7px; border-radius:20px;
    background:var(--accent-soft); color:var(--accent); white-space:nowrap;
  }
  .tag.sample{ background:var(--amber-soft); color:var(--amber); }

  .notice{
    display:block;
    padding:9px 14px;
    border-radius:var(--radius);
    border:1px solid var(--amber);
    background:var(--amber-soft);
    color:#7A5A1E;
    font-size:12px;
    margin-bottom:16px;
  }

  /* ---- 全体サマリー ---- */
  .summary-bar{
    display:flex; gap:32px; flex-wrap:wrap;
    background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:16px 20px; margin-bottom:26px; font-size:12px; box-shadow:var(--shadow);
  }
  .summary-bar .item{ display:flex; flex-direction:column; gap:2px; min-width:140px; }
  .summary-bar .item .label{ color:var(--ink-soft); font-size:11px; }
  .summary-bar .item .val{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900; font-size:28px; line-height:1.1; }
  .summary-bar .item .val .unit{ font-size:12px; font-weight:500; color:var(--ink-soft); margin-left:2px; }
  .val.bal-ok{color:var(--accent);} .val.bal-low{color:var(--amber);} .val.bal-zero{color:var(--red);}

  .section-title{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
  }
  .section-title h2{ font-size:15px; margin:0; }

  .toolbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px; gap:12px; flex-wrap:wrap;
  }
  .toolbar .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .toolbar .filters input[type=text]{ min-width:200px; }

  /* ---- クライアントカード(stub) ---- */
  .client-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; margin-bottom:36px; }
  .stub{
    background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:16px 16px 14px; position:relative; box-shadow:var(--shadow); cursor:pointer;
    transition:border-color .15s ease;
  }
  .stub:hover{ border-color:var(--accent); }
  .stub.selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .stub::before{
    content:""; position:absolute; left:0; right:0; bottom:66px; height:0;
    border-bottom:1px dashed var(--line);
  }
  .stub-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px; }
  .stub-head .name{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:15px; }
  .stub-note{ font-size:11px; color:var(--ink-soft); margin:4px 0 18px; min-height:14px; display:flex; justify-content:space-between; }
  .stub-balance{ display:flex; align-items:baseline; gap:6px; padding-top:14px; }
  .stub-balance .num{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900; font-size:30px; line-height:1; }
  .stub-balance .unit{ font-size:11px; color:var(--ink-soft); }
  .stub-meta{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-top:8px; }
  .stub-meta b{ color:var(--ink); font-weight:700; }
  .stub-actions{ display:flex; gap:6px; margin-top:12px; }

  /* ---- 詳細セクション ---- */
  #detailSection{
    background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:20px 22px; margin-bottom:30px;
  }
  .detail-head{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;
    margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .detail-head h2{ margin:0 0 4px; font-size:17px; }
  .detail-head .meta{ font-size:11px; color:var(--ink-soft); }
  .period-fields{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); }
  .period-fields input{ width:110px; }

  nav.tabs{ display:flex; gap:2px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  nav.tabs button{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:13.5px; font-weight:700;
    background:none; border:none; padding:9px 14px; cursor:pointer; color:var(--ink-soft);
    border-bottom:3px solid transparent; position:relative; top:1px;
  }
  nav.tabs button.active{ color:var(--ink); border-bottom-color:var(--accent); }
  nav.tabs .count{ font-family:'Noto Sans JP', sans-serif; font-weight:400; font-size:11px; color:var(--ink-soft); margin-left:4px; }
  .panel{display:none;} .panel.active{display:block;}

  table{ width:100%; border-collapse:collapse; background:var(--paper); font-size:13px; }
  th, td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); }
  th{ font-family:'Zen Kaku Gothic New', sans-serif; font-size:11px; color:var(--ink-soft); font-weight:700; border-bottom:2px solid var(--ink); }
  th.num, td.num{ text-align:right; font-family:'Zen Kaku Gothic New', sans-serif; }
  tfoot td{ font-weight:700; border-bottom:none; border-top:2px solid var(--ink); }
  .issue-key{ color:var(--accent); font-weight:700; font-size:12.5px; }

  .badge-status{ font-size:11px; padding:3px 9px; border-radius:20px; font-weight:700; white-space:nowrap; }
  .st-未対応{background:#E5E7DF; color:var(--ink-soft);}
  .st-処理中{background:var(--accent-soft); color:var(--accent);}
  .st-完了{background:#D9EBD3; color:#3A7A2A;}

  .empty{
    padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13px;
    border:1px dashed var(--line); border-radius:6px; background:var(--paper);
  }

  .status-note{ font-size:11px; color:var(--ink-soft); margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }

  /* ---- modal ---- */
  .overlay{ display:none; position:fixed; inset:0; background:rgba(31,42,34,0.35); align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.active{ display:flex; }
  .modal{ background:var(--paper); border-radius:6px; width:100%; max-width:440px; padding:22px; box-shadow:0 10px 40px rgba(0,0,0,0.2); max-height:90vh; overflow-y:auto; }
  .modal h3{ margin:0 0 16px; font-size:16px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .field input{ width:100%; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

  @media (max-width:560px){
    header.top{ flex-direction:column; align-items:flex-start; gap:4px; }
    table, thead, tbody, th, td, tr { display:block; }
    thead{display:none;}
    tr{border-bottom:2px solid var(--line); padding:8px 0;}
    td{border:none; padding:4px 10px;}
    td::before{content:attr(data-label); display:inline-block; width:80px; color:var(--ink-soft); font-size:11px;}
  }
</style>
</head>
<body>
<div class="app">

  <div id="listPage">
    <header class="top">
      <div class="brand">
        <h1>保守工数ダッシュボード</h1>
        <span class="sub">クライアント別 Backlog 工数管理</span>
      </div>
      <button class="primary" id="btnAddClient">＋ クライアント追加</button>
    </header>

    <div class="section-title"><h2>クライアント一覧</h2></div>
    <div class="toolbar">
      <div class="filters">
        <input type="text" id="clientSearch" placeholder="クライアント名で検索">
        <select id="directorFilter"><option value="">すべての担当者</option></select>
      </div>
    </div>
    <div class="client-grid" id="clientGrid"></div>
    <div class="empty" id="clientEmpty" style="display:none;">クライアントがまだ登録されていません。「＋ クライアント追加」から登録してください。</div>
  </div>

  <div id="detailPage" style="display:none;">
    <button class="ghost" id="btnBackToList" style="margin-bottom:16px;">← クライアント一覧に戻る</button>
    <section id="detailSection"></section>
  </div>

</div>

<!-- クライアント追加モーダル -->
<div class="overlay" id="addClientOverlay">
  <div class="modal">
    <h3 id="clientModalTitle">クライアントを追加</h3>
    <div class="field"><label>クライアント名</label><input type="text" id="inputName" placeholder="例: NIPPN"></div>
    <div class="field"><label>担当者</label><input type="text" id="inputDirector" placeholder="例: 佐藤"></div>
    <div class="field"><label>Backlog スペースURL</label><input type="text" id="inputSpaceUrl" placeholder="https://xxxxx.backlog.com"></div>
    <div class="field-row">
      <div class="field"><label>プロジェクトID(またはキー)</label><input type="text" id="inputProjectId" placeholder="例: 481033 または YOURMEAL"></div>
      <div class="field"><label>APIキー</label><input type="text" id="inputApiKey" placeholder="Backlogで発行したキー"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>月次契約工数(h)</label><input type="text" id="inputMonthly" placeholder="160"></div>
      <div class="field"><label>前月繰越(h)</label><input type="text" id="inputCarry" placeholder="0"></div>
      <div class="field"><label>今月追加工数(h)</label><input type="text" id="inputExtra" placeholder="0"></div>
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="ghost" id="btnDeleteClient" style="display:none; color:var(--red); border-color:var(--red-soft);">クライアントを削除</button>
      <div style="display:flex; gap:8px; margin-left:auto;">
        <button class="ghost" id="btnCancelAdd">キャンセル</button>
        <button class="primary" id="btnSaveClient">登録する</button>
      </div>
    </div>
    <p class="status-note">※ Backlog APIはCORSに対応しているため、サーバーを介さずこの画面(ブラウザ)から直接取得します。APIキーはこの画面のコード上に保持されるため、社内の信頼できるメンバーだけがこの画面にアクセスできるようにしてください。</p>
  </div>
</div>

<script>
  // ---------------- データ ----------------
  // ---------------- 共有ストレージ(クライアント一覧をチーム全員で共有) ----------------
  // デプロイしたclients-store WorkerのURLをここに設定してください。
  // 例: "https://clients-store.xxxx.workers.dev/clients"
  const CLIENTS_API_URL = "";

  let clients = [];
  let clientsLoaded = false;

  async function loadClientsFromServer(){
    if(!CLIENTS_API_URL){
      clientsLoaded = true;
      return;
    }
    try{
      const res = await fetch(CLIENTS_API_URL);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const body = await res.json();
      clients = Array.isArray(body.clients) ? body.clients : [];
    }catch(err){
      console.error('クライアント一覧の読み込みに失敗しました', err);
      showSyncBanner('クライアント一覧の読み込みに失敗しました。共有ストレージへの接続を確認してください。(' + err.message + ')', true);
    }
    clientsLoaded = true;
  }

  let saveTimer = null;
  async function saveClientsToServer(){
    if(!CLIENTS_API_URL) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try{
        const res = await fetch(CLIENTS_API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clients }),
        });
        if(!res.ok) throw new Error('HTTP ' + res.status);
      }catch(err){
        console.error('クライアント一覧の保存に失敗しました', err);
        showSyncBanner('保存に失敗しました。ネットワークを確認して、もう一度操作してください。(' + err.message + ')', true);
      }
    }, 300);
  }

  function showSyncBanner(message, isError){
    let banner = document.getElementById('syncBanner');
    if(!banner){
      banner = document.createElement('div');
      banner.id = 'syncBanner';
      banner.className = 'notice';
      document.querySelector('.app').prepend(banner);
    }
    banner.textContent = message;
    banner.style.background = isError ? 'var(--red-soft)' : 'var(--amber-soft)';
    banner.style.borderColor = isError ? 'var(--red)' : 'var(--amber)';
    banner.style.color = isError ? 'var(--red)' : '#7A5A1E';
  }

  let selectedClientId = null;
  let activeTab = "completed";
  let filterText = "";
  let filterDirector = "";

  // サンプル課題プール(クライアントごとに軽く配分を変える)
  const issuePool = [
    { key:"142", summary:"商品マスタ画面の表示崩れ修正", status:"完了", type:"バグ", est:4, act:3.5 },
    { key:"145", summary:"在庫連携バッチのエラー調査", status:"完了", type:"保守対応", est:6, act:7 },
    { key:"148", summary:"月次レポート出力項目の追加", status:"完了", type:"機能追加", est:5, act:4.5 },
    { key:"151", summary:"ログイン画面のアクセシビリティ改善", status:"完了", type:"改善", est:3, act:2.5 },
    { key:"153", summary:"検索APIのレスポンス遅延対応", status:"完了", type:"バグ", est:4, act:2 },
    { key:"156", summary:"権限管理画面のリニューアル", status:"処理中", type:"機能追加", est:8, act:3 },
    { key:"158", summary:"通知メールテンプレートの整理", status:"未対応", type:"改善", est:3, act:0 },
    { key:"159", summary:"CSVエクスポートの文字化け調査", status:"処理中", type:"バグ", est:3, act:1 },
    { key:"162", summary:"発注書PDFの自動生成", status:"完了", type:"発注", est:5, act:5 },
  ];

  function hashSeed(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }

  // 完了/処理中(対応中)/未対応 の3分類だけを対象にする
  function splitByStatus(issues){
    return {
      completed: issues.filter(i => i.status === '完了'),
      inProgress: issues.filter(i => i.status === '処理中'),
      notStarted: issues.filter(i => i.status === '未対応'),
    };
  }

  function getSampleIssuesForClient(client){
    const seed = hashSeed(client.id + client.from + client.to);
    const items = issuePool.filter(i => i.type !== "発注").filter((_, idx) => (seed + idx) % 3 !== 0);
    const withKey = items.map(i => ({ ...i, issueKey: client.name.slice(0,4).toUpperCase() + "-" + i.key }));
    return splitByStatus(withKey);
  }

  // 実データ(Backlogから取得済み)があればそれを、なければサンプルを返す
  function getIssuesForClient(client){
    return client.data || getSampleIssuesForClient(client);
  }

  // ---- Backlog API を直接呼び出す(CORS対応のためブラウザから直接叩ける) ----
  async function backlogGet(spaceUrl, apiKey, path, params){
    const url = new URL(spaceUrl.replace(/\/$/, '') + '/api/v2' + path);
    url.searchParams.set('apiKey', apiKey);
    for(const [k,v] of Object.entries(params || {})){
      if(Array.isArray(v)) v.forEach(vv => url.searchParams.append(k, vv));
      else if(v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
    }
    const res = await fetch(url.toString());
    if(!res.ok){
      const text = await res.text().catch(() => '');
      throw new Error(`Backlog API error (${res.status}) ${text.slice(0,120)}`);
    }
    return res.json();
  }

  async function backlogGetAllIssues(spaceUrl, apiKey, projectId, extraParams){
    const all = [];
    let offset = 0;
    const count = 100;
    while(true){
      const page = await backlogGet(spaceUrl, apiKey, '/issues', {
        ...extraParams, 'projectId[]': [projectId], count, offset,
      });
      all.push(...page);
      if(page.length < count) break;
      offset += count;
    }
    return all;
  }

  function mapBacklogIssue(i){
    return {
      issueKey: i.issueKey,
      summary: i.summary,
      status: i.status ? i.status.name : '',
      type: i.issueType ? i.issueType.name : '',
      est: i.estimatedHours || 0,
      act: i.actualHours || 0,
    };
  }

  async function fetchFromBacklog(client, from, to){
    const { spaceUrl, apiKey, projectId: projectIdOrKey } = client;

    // プロジェクトキー("YOURMEAL"等)でも数値IDでも動くよう、まずプロジェクト情報を解決する
    const project = await backlogGet(spaceUrl, apiKey, `/projects/${projectIdOrKey}`);
    const projectId = project.id;

    const [statuses, issueTypes] = await Promise.all([
      backlogGet(spaceUrl, apiKey, `/projects/${projectId}/statuses`),
      backlogGet(spaceUrl, apiKey, `/projects/${projectId}/issueTypes`),
    ]);
    // 完了・処理中(対応中)・未対応 の3つだけを対象にする(それ以外のカスタムステータスは対象外)
    const completedIds = statuses.filter(s => s.name === '完了').map(s => s.id);
    const inProgressIds = statuses.filter(s => s.name === '処理中').map(s => s.id);
    const notStartedIds = statuses.filter(s => s.name === '未対応').map(s => s.id);
    const targetStatusIds = [...completedIds, ...inProgressIds, ...notStartedIds];
    const nonPOTypeIds = issueTypes.filter(t => !t.name.includes('発注')).map(t => t.id);

    // 期間はすべてのステータスに共通で適用する(更新日を基準に絞り込み)
    const raw = targetStatusIds.length && nonPOTypeIds.length
      ? await backlogGetAllIssues(spaceUrl, apiKey, projectId, {
          'statusId[]': targetStatusIds, 'issueTypeId[]': nonPOTypeIds,
          updatedSince: from, updatedUntil: to,
        })
      : [];

    return splitByStatus(raw.map(mapBacklogIssue));
  }

  function summarizeIssues(list){
    return {
      count: list.length,
      totalEst: Math.round(list.reduce((s,i)=>s+i.est,0)*100)/100,
      totalAct: Math.round(list.reduce((s,i)=>s+i.act,0)*100)/100,
      issues: list,
    };
  }

  // 完了・対応中(処理中)の工数だけを残工数から差し引く。未対応はまだ着手前なので差し引かない。
  function getClientTotals(client){
    const { completed, inProgress, notStarted } = getIssuesForClient(client);
    const completedSum = summarizeIssues(completed);
    const inProgressSum = summarizeIssues(inProgress);
    const notStartedSum = summarizeIssues(notStarted);

    const est = Math.round((completedSum.totalEst + inProgressSum.totalEst) * 100) / 100;
    const act = Math.round((completedSum.totalAct + inProgressSum.totalAct) * 100) / 100;
    const capacity = Math.round((client.monthlyHours + client.carryOverHours + client.extraHours) * 100) / 100;
    const remaining = Math.round((capacity - est - act) * 100) / 100;

    return {
      completed: completedSum, inProgress: inProgressSum, notStarted: notStartedSum,
      est, act,
      actFromCompleted: completedSum.totalAct, actFromInProgress: inProgressSum.totalAct,
      capacity, remaining,
    };
  }

  function balClass(remaining, capacity){
    if(remaining <= 0) return 'bal-zero';
    if(remaining < capacity * 0.2) return 'bal-low';
    return 'bal-ok';
  }
  function statusClass(status){
    if(status === '完了') return 'st-完了';
    if(status === '処理中') return 'st-処理中';
    return 'st-未対応';
  }

  // ---------------- 描画 ----------------
  function populateDirectorFilter(){
    const select = document.getElementById('directorFilter');
    const current = select.value;
    const directors = Array.from(new Set(clients.map(c => c.director).filter(Boolean))).sort();
    select.innerHTML = '<option value="">すべての担当者</option>' +
      directors.map(d => `<option value="${d}">${d}</option>`).join('');
    if(directors.includes(current)) select.value = current;
  }

  function getFilteredClients(){
    return clients.filter(c => {
      const matchesText = !filterText || c.name.toLowerCase().includes(filterText.toLowerCase());
      const matchesDirector = !filterDirector || c.director === filterDirector;
      return matchesText && matchesDirector;
    });
  }

  function renderClientGrid(){
    populateDirectorFilter();
    const grid = document.getElementById('clientGrid');
    const empty = document.getElementById('clientEmpty');
    const list = getFilteredClients();
    if(clients.length === 0){
      grid.innerHTML = ''; empty.style.display = 'block';
      empty.textContent = 'クライアントがまだ登録されていません。「＋ クライアント追加」から登録してください。';
      return;
    }
    if(list.length === 0){
      grid.innerHTML = ''; empty.style.display = 'block';
      empty.textContent = '条件に一致するクライアントがありません。';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = list.map(c => {
      const t = getClientTotals(c);
      const cls = balClass(t.remaining, t.capacity || 1);
      return `
        <div class="stub ${c.id === selectedClientId ? 'selected' : ''}" data-id="${c.id}">
          <div class="stub-head">
            <span class="name">${c.name}</span>
            <span class="tag ${c.synced ? '' : 'sample'}">${c.synced ? '同期済み' : '未取得'}</span>
          </div>
          <div class="stub-note"><span>Project #${c.projectId}</span><span>担当: ${c.director || '未設定'}</span></div>
          <div class="stub-balance">
            <span class="num ${cls}">${t.remaining}</span>
            <span class="unit">h 残</span>
          </div>
          <div class="stub-meta"><span>想定工数 <b>${t.est}h</b></span><span>確定工数 <b>${t.act}h</b><span style="color:var(--ink-soft); font-weight:400;">(処理中含む)</span></span></div>
          <div class="stub-actions">
            <button class="ghost" data-detail="${c.id}">詳細を見る</button>
            <button class="ghost" data-edit="${c.id}">編集</button>
          </div>
        </div>
      `;
    }).join('');

    grid.querySelectorAll('[data-detail]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openDetail(btn.dataset.detail);
      });
    });
    grid.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const c = clients.find(cl => cl.id === btn.dataset.edit);
        if(c) openClientModal(c);
      });
    });
    grid.querySelectorAll('.stub').forEach(el => {
      el.addEventListener('click', () => openDetail(el.dataset.id));
    });
  }

  function openDetail(clientId){
    selectedClientId = clientId;
    document.getElementById('listPage').style.display = 'none';
    document.getElementById('detailPage').style.display = 'block';
    renderDetail();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function backToList(){
    selectedClientId = null;
    document.getElementById('detailPage').style.display = 'none';
    document.getElementById('listPage').style.display = 'block';
    renderClientGrid();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  document.getElementById('btnBackToList').addEventListener('click', backToList);

  function renderDetail(){
    const section = document.getElementById('detailSection');
    const client = clients.find(c => c.id === selectedClientId);
    if(!client){ backToList(); return; }
    const t = getClientTotals(client);
    const cls = balClass(t.remaining, t.capacity || 1);

    section.innerHTML = `
      <div class="detail-head">
        <div>
          <h2>${client.name} <button class="ghost" id="btnEditClient" style="font-size:11px; padding:3px 9px; margin-left:6px;">編集</button></h2>
          <div class="meta">${client.spaceUrl} ・ Project #${client.projectId} ・ 担当: ${client.director || '未設定'}</div>
        </div>
        <div class="period-fields">
          <span>集計期間</span>
          <input type="text" id="detailFrom" value="${client.from}">
          <span>〜</span>
          <input type="text" id="detailTo" value="${client.to}">
          <button class="primary" id="btnFetch">この期間で取得</button>
        </div>
      </div>

      <div id="fetchStatus" style="font-size:12px; margin-bottom:14px;"></div>

      <div class="summary-bar" style="margin-bottom:20px;">
        <div class="item">
          <span class="label">残工数</span>
          <span class="val ${cls}">${t.remaining}<span class="unit">h</span></span>
        </div>
        <div class="item">
          <span class="label">想定工数</span>
          <span class="val">${t.est}<span class="unit">h</span></span>
          <span style="font-size:10px; color:var(--ink-soft);">未対応は含みません</span>
        </div>
        <div class="item">
          <span class="label">確定工数</span>
          <span class="val">${t.act}<span class="unit">h</span></span>
          <span style="font-size:10px; color:var(--ink-soft);">完了 ${t.actFromCompleted}h + 対応中 ${t.actFromInProgress}h</span>
        </div>
        <div class="item">
          <span class="label">今月使用可能</span>
          <span class="val">${t.capacity}<span class="unit">h</span></span>
        </div>
      </div>

      <nav class="tabs">
        <button class="tab-btn ${activeTab==='completed'?'active':''}" data-tab="completed">完了タスク<span class="count">(${t.completed.count})</span></button>
        <button class="tab-btn ${activeTab==='inProgress'?'active':''}" data-tab="inProgress">対応中タスク<span class="count">(${t.inProgress.count})</span></button>
        <button class="tab-btn ${activeTab==='notStarted'?'active':''}" data-tab="notStarted">未対応タスク<span class="count">(${t.notStarted.count})</span></button>
      </nav>
      <div class="panel ${activeTab==='completed'?'active':''}" id="panel-completed">${renderTable(t.completed)}</div>
      <div class="panel ${activeTab==='inProgress'?'active':''}" id="panel-inProgress">${renderTable(t.inProgress)}</div>
      <div class="panel ${activeTab==='notStarted'?'active':''}" id="panel-notStarted">${renderTable(t.notStarted)}</div>

      <p class="status-note">
        「この期間で取得」を押すと、指定した期間でBacklogから完了・対応中・未対応のタスクを取得します(ブラウザから直接Backlog APIを呼び出します。APIキー未設定の場合はサンプルデータのままです)。
        期間は更新日(≒その状態になった日に近い)を基準に、3つのステータスすべてに適用されます。残工数からは「完了」と「対応中」の工数だけを差し引き、「未対応」はまだ着手前のため差し引きません。
      </p>

      <div class="section-title" style="margin-top:28px;"><h2>月次履歴</h2></div>
      ${renderHistoryTable(client)}
    `;

    section.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; renderDetail(); });
    });
    document.getElementById('btnEditClient').addEventListener('click', () => openClientModal(client));
    document.getElementById('btnFetch').addEventListener('click', async () => {
      const from = document.getElementById('detailFrom').value.trim();
      const to = document.getElementById('detailTo').value.trim();
      client.from = from || client.from;
      client.to = to || client.to;

      const statusEl = document.getElementById('fetchStatus');
      const btn = document.getElementById('btnFetch');

      if(!client.apiKey){
        statusEl.textContent = 'APIキーが未設定のため、サンプルデータのまま表示します(クライアント編集からAPIキーを設定してください)。';
        statusEl.style.color = 'var(--amber)';
        renderClientGrid(); renderDetail();
        return;
      }

      btn.disabled = true;
      statusEl.style.color = 'var(--ink-soft)';
      statusEl.textContent = 'Backlogからタスクを取得中...';

      try{
        const data = await fetchFromBacklog(client, client.from, client.to);
        client.data = data;
        client.synced = true;
        saveToHistory(client, client.from, client.to, data);
        saveClientsToServer();
        renderClientGrid();
        renderDetail();
        document.getElementById('fetchStatus').textContent = '実データを取得し、月次履歴に記録しました';
        document.getElementById('fetchStatus').style.color = 'var(--accent)';
      }catch(err){
        statusEl.textContent = '取得に失敗しました: ' + err.message;
        statusEl.style.color = 'var(--red)';
        btn.disabled = false;
      }
    });

    section.querySelectorAll('[data-load-history]').forEach(btn => {
      btn.addEventListener('click', () => {
        const entry = client.history.find(h => h.from === btn.dataset.loadHistory);
        if(!entry) return;
        client.data = entry.data;
        client.from = entry.from;
        client.to = entry.to;
        renderClientGrid();
        renderDetail();
      });
    });
  }

  // ---------------- 月次履歴 ----------------
  function saveToHistory(client, from, to, data){
    const t1 = summarizeIssues(data.completed);
    const t2 = summarizeIssues(data.inProgress);
    const est = Math.round((t1.totalEst + t2.totalEst) * 100) / 100;
    const act = Math.round((t1.totalAct + t2.totalAct) * 100) / 100;
    const capacity = Math.round((client.monthlyHours + client.carryOverHours + client.extraHours) * 100) / 100;
    const remaining = Math.round((capacity - est - act) * 100) / 100;
    const entry = { from, to, fetchedAt: new Date().toISOString(), est, act, capacity, remaining, data };

    const idx = client.history.findIndex(h => h.from === from && h.to === to);
    if(idx >= 0) client.history[idx] = entry; else client.history.push(entry);
    client.history.sort((a, b) => (a.from < b.from ? 1 : -1)); // 新しい期間が上に来るように
  }

  function renderHistoryTable(client){
    if(!client.history || client.history.length === 0){
      return '<div class="empty">まだ履歴がありません。「この期間で取得」を押すと、その期間の集計結果がここに記録されます。</div>';
    }
    const rows = client.history.map(h => `
      <tr>
        <td data-label="期間">${h.from} 〜 ${h.to}</td>
        <td data-label="想定工数" class="num">${h.est}</td>
        <td data-label="確定工数" class="num">${h.act}</td>
        <td data-label="残工数" class="num">${h.remaining}</td>
        <td data-label="操作"><button class="ghost" style="font-size:11px; padding:3px 9px;" data-load-history="${h.from}">この期間を表示</button></td>
      </tr>
    `).join('');
    return `
      <table>
        <thead><tr><th>期間</th><th class="num">想定工数</th><th class="num">確定工数</th><th class="num">残工数</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function renderTable(t){
    if(!t || t.issues.length === 0){
      return '<div class="empty">該当する課題はありません。</div>';
    }
    const rows = t.issues.map(i => `
      <tr>
        <td data-label="課題キー"><span class="issue-key">${i.issueKey}</span></td>
        <td data-label="概要">${i.summary}</td>
        <td data-label="種別">${i.type}</td>
        <td data-label="状態"><span class="badge-status ${statusClass(i.status)}">${i.status}</span></td>
        <td data-label="想定工数" class="num">${i.est}</td>
        <td data-label="確定工数" class="num">${i.act}</td>
      </tr>
    `).join('');
    return `
      <table>
        <thead><tr><th>課題キー</th><th>概要</th><th>種別</th><th>状態</th><th class="num">想定工数</th><th class="num">確定工数</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="4">合計</td><td class="num">${t.totalEst}</td><td class="num">${t.totalAct}</td></tr></tfoot>
      </table>
    `;
  }

  // ---------------- クライアント追加モーダル ----------------
  document.getElementById('clientSearch').addEventListener('input', (e) => {
    filterText = e.target.value;
    renderClientGrid();
  });
  document.getElementById('directorFilter').addEventListener('change', (e) => {
    filterDirector = e.target.value;
    renderClientGrid();
  });

  const overlay = document.getElementById('addClientOverlay');
  let editingClientId = null;

  function openClientModal(client){
    editingClientId = client ? client.id : null;
    document.getElementById('clientModalTitle').textContent = client ? 'クライアントを編集' : 'クライアントを追加';
    document.getElementById('btnSaveClient').textContent = client ? '更新する' : '登録する';
    document.getElementById('btnDeleteClient').style.display = client ? 'inline-block' : 'none';

    document.getElementById('inputName').value = client ? client.name : '';
    document.getElementById('inputDirector').value = client ? (client.director || '') : '';
    document.getElementById('inputSpaceUrl').value = client ? client.spaceUrl : '';
    document.getElementById('inputProjectId').value = client ? client.projectId : '';
    document.getElementById('inputApiKey').value = client ? (client.apiKey || '') : '';
    document.getElementById('inputMonthly').value = client ? client.monthlyHours : '';
    document.getElementById('inputCarry').value = client ? client.carryOverHours : '';
    document.getElementById('inputExtra').value = client ? client.extraHours : '';

    overlay.classList.add('active');
  }

  document.getElementById('btnAddClient').addEventListener('click', () => openClientModal(null));
  document.getElementById('btnCancelAdd').addEventListener('click', () => overlay.classList.remove('active'));
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('active'); });

  document.getElementById('btnSaveClient').addEventListener('click', () => {
    const name = document.getElementById('inputName').value.trim();
    const director = document.getElementById('inputDirector').value.trim();
    const spaceUrl = document.getElementById('inputSpaceUrl').value.trim();
    const projectId = document.getElementById('inputProjectId').value.trim();
    const apiKey = document.getElementById('inputApiKey').value.trim();
    if(!name || !spaceUrl || !projectId){
      alert('クライアント名・スペースURL・プロジェクトIDは必須です');
      return;
    }
    const monthlyHours = parseFloat(document.getElementById('inputMonthly').value) || 0;
    const carryOverHours = parseFloat(document.getElementById('inputCarry').value) || 0;
    const extraHours = parseFloat(document.getElementById('inputExtra').value) || 0;

    if(editingClientId){
      const c = clients.find(cl => cl.id === editingClientId);
      const credentialsChanged = c.spaceUrl !== spaceUrl || c.projectId !== projectId || c.apiKey !== apiKey;
      Object.assign(c, { name, director, spaceUrl, projectId, apiKey, monthlyHours, carryOverHours, extraHours });
      if(credentialsChanged){
        // 接続先が変わった場合は取得済みデータを無効化し、再取得を促す
        c.data = null;
        c.synced = false;
      }
      saveClientsToServer();
      overlay.classList.remove('active');
      renderClientGrid();
      if(selectedClientId === c.id) renderDetail();
    } else {
      const id = 'c' + Date.now();
      clients.push({
        id, name, director, spaceUrl, projectId, apiKey,
        monthlyHours, carryOverHours, extraHours,
        from: '2026-08-01', to: '2026-08-30', synced: false, data: null, history: [],
      });
      saveClientsToServer();
      overlay.classList.remove('active');
      renderClientGrid();
      openDetail(id);
    }
  });

  document.getElementById('btnDeleteClient').addEventListener('click', () => {
    if(!editingClientId) return;
    if(!confirm('このクライアントを削除しますか？')) return;
    clients = clients.filter(c => c.id !== editingClientId);
    saveClientsToServer();
    if(selectedClientId === editingClientId){
      overlay.classList.remove('active');
      backToList();
      return;
    }
    overlay.classList.remove('active');
    renderClientGrid();
  });

  // ---------------- 初期描画 ----------------
  (async () => {
    showSyncBanner('クライアント一覧を読み込み中...', false);
    await loadClientsFromServer();
    const banner = document.getElementById('syncBanner');
    if(banner) banner.remove();
    if(!CLIENTS_API_URL){
      showSyncBanner('共有ストレージが未設定です。この画面を閉じると登録内容は失われます(設定方法は管理者に確認してください)。', false);
    }
    renderClientGrid();
  })();
</script>
</body>
</html>
